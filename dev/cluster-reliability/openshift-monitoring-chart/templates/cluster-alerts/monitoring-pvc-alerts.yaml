apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-pvc-alerts
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: cluster-monitoring
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: monitoring-pvc
      rules:

        - alert: MonitoringPVCAlmostFull
          expr: |
            (
              kubelet_volume_stats_used_bytes{
                namespace="openshift-monitoring"
              }
              /
              kubelet_volume_stats_capacity_bytes{
                namespace="openshift-monitoring"
              }
            ) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Monitoring PVC usage is high"
            description: "PVC {{ "{{ $labels.persistentvolumeclaim }}" }} in namespace {{ "{{ $labels.namespace }}" }} is more than 80% full."

        - alert: MonitoringPVCCritical
          expr: |
            (
              kubelet_volume_stats_used_bytes{
                namespace="openshift-monitoring"
              }
              /
              kubelet_volume_stats_capacity_bytes{
                namespace="openshift-monitoring"
              }
            ) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Monitoring PVC is critically full"
            description: "PVC {{ "{{ $labels.persistentvolumeclaim }}" }} in namespace {{ "{{ $labels.namespace }}" }} is more than 90% full."

        - alert: MonitoringPVCAlmostOutOfSpace
          expr: |
            kubelet_volume_stats_available_bytes{
              namespace="openshift-monitoring"
            } < 2 * 1024 * 1024 * 1024
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Monitoring PVC has less than 2GiB available"
            description: "PVC {{ "{{ $labels.persistentvolumeclaim }}" }} has less than 2GiB of available space."

        - alert: MonitoringPVCNotBound
          expr: |
            kube_persistentvolumeclaim_status_phase{
              namespace="openshift-monitoring",
              phase!="Bound"
            } == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Monitoring PVC is not Bound"
            description: "PVC {{ "{{ $labels.persistentvolumeclaim }}" }} in openshift-monitoring is not Bound."
