apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lvm-usage-alerts
  namespace: openshift-monitoring
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: lvm-usage
      interval: 30s
      rules:
        # --------------------------------------------------------
        # Thin pool DATA
        # --------------------------------------------------------
        - alert: LVMThinPoolDataHigh
          expr: |
            topolvm_thinpool_data_percent{
              device_class="lvm-vg1"
            } > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LVM thin pool data usage is high"
            description: "LVM thin pool {{ $labels.device_class }} on {{ $labels.node }} is above 80% data utilization."

        - alert: LVMThinPoolDataCritical
          expr: |
            topolvm_thinpool_data_percent{
              device_class="lvm-vg1"
            } > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LVM thin pool data usage is critical"
            description: "LVM thin pool {{ $labels.device_class }} on {{ $labels.node }} is above 90% data utilization."
        # --------------------------------------------------------
        # Thin pool METADATA
        # --------------------------------------------------------
        - alert: LVMThinPoolMetadataHigh
          expr: |
            topolvm_thinpool_metadata_percent{
              device_class="lvm-vg1"
            } > 70
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LVM thin pool metadata usage is high"
            description: "LVM thin pool metadata on {{ $labels.node }} is above 70%."

        - alert: LVMThinPoolMetadataCritical
          expr: |
            topolvm_thinpool_metadata_percent{
              device_class="lvm-vg1"
            } > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LVM thin pool metadata usage is critical"
            description: "LVM thin pool metadata on {{ $labels.node }} is above 85%."
        # --------------------------------------------------------
        # Volume Group FREE SPACE
        # --------------------------------------------------------
        - alert: LVMVolumeGroupSpaceLow
          expr: |
            (
              topolvm_volumegroup_available_bytes{
                device_class="lvm-vg1"
              }
              /
              topolvm_volumegroup_size_bytes{
                device_class="lvm-vg1"
              }
            ) * 100 < 20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LVM volume group free space is low"
            description: "LVM volume group {{ $labels.device_class }} on {{ $labels.node }} has less than 20% free capacity."
        - alert: LVMVolumeGroupSpaceCritical
          expr: |
            (
              topolvm_volumegroup_available_bytes{
                device_class="lvm-vg1"
              }
              /
              topolvm_volumegroup_size_bytes{
                device_class="lvm-vg1"
              }
            ) * 100 < 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LVM volume group free space is critical"
            description: "LVM volume group {{ $labels.device_class }} on {{ $labels.node }} has less than 10% free capacity."
        # --------------------------------------------------------
        # Thin pool overprovisioning
        # --------------------------------------------------------
        - alert: LVMThinPoolOverprovisioningExhausted
          expr: |
            topolvm_thinpool_overprovisioned_available{
              device_class="lvm-vg1"
            } < 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LVM thin pool overprovisioning exhausted"
            description: "LVM thin pool {{ $labels.device_class }} on {{ $labels.node }} has exhausted its available overprovisioned capacity."