apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lvm-usage-alerts
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: cluster-monitoring
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: topolvm-usage
      rules:

        - alert: LVMThinPoolDataHigh
          expr: |
            topolvm_thinpool_data_percent{
              device_class="lvm-vg1"
            } > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LVM thin pool data usage is high"
            description: "LVM thin pool {{ "{{ $labels.device_class }}" }} on {{ "{{ $labels.node }}" }} is more than 80% used."

        - alert: LVMThinPoolDataCritical
          expr: |
            topolvm_thinpool_data_percent{
              device_class="lvm-vg1"
            } > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LVM thin pool data usage is critical"
            description: "LVM thin pool {{ "{{ $labels.device_class }}" }} on {{ "{{ $labels.node }}" }} is more than 90% used."

        - alert: LVMThinPoolMetadataHigh
          expr: |
            topolvm_thinpool_metadata_percent{
              device_class="lvm-vg1"
            } > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LVM thin pool metadata usage is high"
            description: "LVM thin pool metadata on {{ "{{ $labels.node }}" }} is more than 80% used."

        - alert: LVMThinPoolMetadataCritical
          expr: |
            topolvm_thinpool_metadata_percent{
              device_class="lvm-vg1"
            } > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LVM thin pool metadata usage is critical"
            description: "LVM thin pool metadata on {{ "{{ $labels.node }}" }} is more than 90% used."

        - alert: LVMVolumeGroupLowSpace
          expr: |
            (
              topolvm_volumegroup_available_bytes{
                device_class="lvm-vg1"
              }
              /
              topolvm_volumegroup_size_bytes{
                device_class="lvm-vg1"
              }
            ) * 100 < 20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LVM volume group has low free space"
            description: "LVM volume group {{ "{{ $labels.device_class }}" }} on {{ "{{ $labels.node }}" }} has less than 20% free space."

        - alert: LVMVolumeGroupCriticalSpace
          expr: |
            (
              topolvm_volumegroup_available_bytes{
                device_class="lvm-vg1"
              }
              /
              topolvm_volumegroup_size_bytes{
                device_class="lvm-vg1"
              }
            ) * 100 < 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LVM volume group critically low on space"
            description: "LVM volume group {{ "{{ $labels.device_class }}" }} on {{ "{{ $labels.node }}" }} has less than 10% free space."
