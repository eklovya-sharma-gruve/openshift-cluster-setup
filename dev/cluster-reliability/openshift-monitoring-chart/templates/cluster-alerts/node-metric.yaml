apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-monitoring-alerts
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: cluster-monitoring
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: node-monitoring
      rules:

        - alert: NodeCPUHigh
          expr: |
            100 - (
              avg by (instance) (
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              ) * 100
            ) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on node"
            description: "Node {{ "{{ $labels.instance }}" }} has CPU usage above 85% for more than 10 minutes."

        - alert: NodeMemoryHigh
          expr: |
            (
              1 -
              node_memory_MemAvailable_bytes /
              node_memory_MemTotal_bytes
            ) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on node"
            description: "Node {{ "{{ $labels.instance }}" }} has memory usage above 85% for more than 10 minutes."

        - alert: NodeMemoryCritical
          expr: |
            (
              1 -
              node_memory_MemAvailable_bytes /
              node_memory_MemTotal_bytes
            ) * 100 > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Critical memory usage on node"
            description: "Node {{ "{{ $labels.instance }}" }} has memory usage above 95% for more than 5 minutes."

        - alert: NodeFilesystemAlmostFull
          expr: |
            (
              node_filesystem_size_bytes{
                fstype!~"tmpfs|overlay|squashfs"
              }
              -
              node_filesystem_avail_bytes{
                fstype!~"tmpfs|overlay|squashfs"
              }
            )
            /
            node_filesystem_size_bytes{
              fstype!~"tmpfs|overlay|squashfs"
            } * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node filesystem usage is high"
            description: "Filesystem {{ "{{ $labels.mountpoint }}" }} on {{ "{{ $labels.instance }}" }} is above 85% used."

        - alert: NodeFilesystemCritical
          expr: |
            (
              node_filesystem_size_bytes{
                fstype!~"tmpfs|overlay|squashfs"
              }
              -
              node_filesystem_avail_bytes{
                fstype!~"tmpfs|overlay|squashfs"
              }
            )
            /
            node_filesystem_size_bytes{
              fstype!~"tmpfs|overlay|squashfs"
            } * 100 > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node filesystem critically full"
            description: "Filesystem {{ "{{ $labels.mountpoint }}" }} on {{ "{{ $labels.instance }}" }} is above 95% used."

        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{
              condition="Ready",
              status="true"
            } == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node is not Ready"
            description: "Kubernetes node {{ "{{ $labels.node }}" }} has been NotReady for more than 5 minutes."
