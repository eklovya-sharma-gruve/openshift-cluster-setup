apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ocp-cluster-overview
  namespace: grafana-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana

  folder: OpenShift Monitoring

  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prom1

  json: |
    {
      "title": "OCP - Cluster Overview",
      "uid": "ocp-cluster-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Nodes",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_node_info)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 2,
          "title": "Ready Nodes",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Namespaces",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_namespace_created)"
            }
          ]
        },
        {
          "id": 4,
          "title": "Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_info)"
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU Usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "Cluster CPU"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 6,
          "title": "Memory Usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))",
              "legendFormat": "Cluster Memory"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 7,
          "title": "Running Pods",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "Running"
            }
          ]
        },
        {
          "id": 8,
          "title": "Pod Restarts",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))",
              "legendFormat": "Restarts / hour"
            }
          ]
        }
      ]
    }

