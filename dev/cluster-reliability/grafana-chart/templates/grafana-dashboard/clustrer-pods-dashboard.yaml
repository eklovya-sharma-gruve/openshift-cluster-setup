apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ocp-pods
  namespace: grafana-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana

  folder: OpenShift Monitoring

  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prom1

  json: |
    {
      "title": "OCP - Pods",
      "uid": "ocp-pods",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Total Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_info)"
            }
          ]
        },
        {
          "id": 2,
          "title": "Running Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})"
            }
          ]
        },
        {
          "id": 3,
          "title": "Pending Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Pending\"})"
            }
          ]
        },
        {
          "id": 4,
          "title": "Failed Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Failed\"})"
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace,pod) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "{{ `{{` }}namespace{{ `}}` }}/{{ `{{` }}pod{{ `}}` }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            }
          }
        },
        {
          "id": 6,
          "title": "Memory Usage by Pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace,pod) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\"})",
              "legendFormat": "{{ `{{` }}namespace{{ `}}` }}/{{ `{{` }}pod{{ `}}` }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 7,
          "title": "Container Restarts",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace,pod) (increase(kube_pod_container_status_restarts_total[1h]))",
              "legendFormat": "{{ `{{` }}namespace{{ `}}` }}/{{ `{{` }}pod{{ `}}` }}"
            }
          ]
        },
        {
          "id": 8,
          "title": "Pod Status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(phase) (kube_pod_status_phase)",
              "legendFormat": "{{ `{{` }}phase{{ `}}` }}"
            }
          ]
        }
      ]
    }

