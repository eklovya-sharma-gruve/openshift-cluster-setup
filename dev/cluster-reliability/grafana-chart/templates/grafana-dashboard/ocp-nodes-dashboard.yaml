apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ocp-nodes
  namespace: grafana-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana

  folder: OpenShift Monitoring

  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prom1

  json: |
    {
      "title": "OCP - Nodes",
      "uid": "ocp-nodes",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Node CPU Usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "{{ `{{` }}instance{{ `}}` }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 2,
          "title": "Node Memory Usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{ `{{` }}instance{{ `}}` }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 3,
          "title": "Node Load",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_load5",
              "legendFormat": "{{ `{{` }}instance{{ `}}` }}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Filesystem Usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - node_filesystem_avail_bytes{fstype!=\"\",mountpoint!=\"/boot\"} / node_filesystem_size_bytes{fstype!=\"\",mountpoint!=\"/boot\"})",
              "legendFormat": "{{ `{{` }}instance{{ `}}` }} {{ `{{` }}mountpoint{{ `}}` }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 5,
          "title": "Network Receive",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(instance) (rate(node_network_receive_bytes_total{device!=\"lo\"}[5m]))",
              "legendFormat": "{{ `{{` }}instance{{ `}}` }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        },
        {
          "id": 6,
          "title": "Network Transmit",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom1"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(instance) (rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m]))",
              "legendFormat": "{{ `{{` }}instance{{ `}}` }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        }
      ]
    }