apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: valuesfrom-test
  namespace: grafana-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana

  valuesFrom:
    - targetPath: basicAuthUser
      valueFrom:
        secretKeyRef:
          name: grafana-prometheus-token
          key: authorization

  datasource:
    name: valuesfrom-test
    type: prometheus
    access: proxy
    url: https://prometheus-k8s.openshift-monitoring.svc.cluster.local:9091
    isDefault: false