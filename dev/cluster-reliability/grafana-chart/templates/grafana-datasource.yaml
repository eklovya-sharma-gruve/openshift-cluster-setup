apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: grafana-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: prom1
    type: prometheus
    url: http://prometheus-k8s:9091
    isDefault: true
    jsonData:
      'tlsSkipVerify': true
      'timeInterval': "5s"
