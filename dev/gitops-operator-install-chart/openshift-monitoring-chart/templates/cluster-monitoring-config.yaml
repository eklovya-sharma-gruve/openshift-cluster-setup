apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |-
    prometheusK8s:
      collectionProfile: full
      logLevel: error
      # Maximum size of Prometheus TSDB data.
      # Keep below the 40Gi PVC to leave filesystem/WAL/headroom.
      retention: 24h
      retentionSize: 12GB
      enforcedBodySizeLimit: 40MB
      volumeClaimTemplate:
        spec:
          storageClassName: storage-cluster-ceph-rbd
          resources:
            requests:
              storage: 15Gi
      # resources:
      #   requests:
      #     cpu: 100m
      #     memory: 512Mi
      #   limits:
      #     cpu: 500m
      #     memory: 2Gi
    alertmanagerMain:
      logLevel: error
      volumeClaimTemplate:
        spec:
          storageClassName: storage-cluster-ceph-rbd
          resources:
            requests:
              storage: 5Gi
      # resources:
      #   requests:
      #     cpu: 50m
      #     memory: 128Mi
      #   limits:
      #     cpu: 250m
      #     memory: 512Mi
