apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-prometheus-token-sync
  namespace: grafana-operator
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: grafana-token-sync
          restartPolicy: OnFailure
          containers:
            - name: token-sync
              image: registry.redhat.io/openshift4/ose-cli:latest
              command:
                - /bin/bash
                - -ec
                - |
                  TOKEN="$(oc create token grafana-sa \
                    -n grafana-operator \
                    --duration=1h)"

                  oc create secret generic grafana-prometheus-token \
                    -n grafana-operator \
                    --from-literal=authorization="Bearer ${TOKEN}" \
                    --dry-run=client -o yaml |
                    oc apply -f -