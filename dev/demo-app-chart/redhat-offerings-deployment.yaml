apiVersion: v1
kind: ConfigMap
metadata:
  name: redhat-offerings-html
  namespace: demo-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Red Hat Offerings</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          margin: 40px;
          background-color: #fff7f7;
        }

        h1 {
          color: #cc0000;
        }

        li {
          margin: 15px 0;
        }
      </style>
    </head>

    <body>
      <h1>Red Hat Offerings</h1>

      <h2>Enterprise Open Source Products</h2>

      <ul>
        <li>
          <b>Red Hat Enterprise Linux (RHEL)</b><br>
          Enterprise Linux operating system providing a secure,
          stable platform for applications and workloads.
        </li>

        <li>
          <b>Red Hat OpenShift</b><br>
          Kubernetes-based application platform for deploying,
          managing, and scaling containerized applications.
        </li>

        <li>
          <b>Red Hat Ansible Automation Platform</b><br>
          Automation solution for configuration management,
          application deployment, and IT operations.
        </li>

        <li>
          <b>Red Hat Advanced Cluster Management</b><br>
          Centralized management platform for multiple Kubernetes
          clusters and hybrid cloud environments.
        </li>

        <li>
          <b>Red Hat Enterprise Linux AI</b><br>
          Enterprise AI platform for developing and running
          trusted AI models on Red Hat infrastructure.
        </li>
      </ul>

    </body>
    </html>

  .htaccess: |
    RewriteEngine On

    RewriteRule ^redhat/?$ /index.html [L]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redhat-offerings
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redhat-offerings
  template:
    metadata:
      labels:
        app: redhat-offerings
    spec:
      containers:
      - name: apache
        image: registry.access.redhat.com/ubi9/httpd-24
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: html
          mountPath: /var/www/html
        - name: apache-config
          mountPath: /etc/httpd/conf.d/override.conf
          subPath: override.conf

      volumes:
      - name: html
        configMap:
          name: redhat-offerings-html

      - name: apache-config
        configMap:
          name: redhat-apache-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redhat-apache-config
  namespace: demo-app
data:
  override.conf: |
    <Directory "/var/www/html">
        AllowOverride All
        Require all granted
    </Directory>

---
apiVersion: v1
kind: Service
metadata:
  name: redhat-service
  namespace: demo-app
spec:
  selector:
    app: redhat-offerings
  ports:
  - port: 8080
    targetPort: 8080
