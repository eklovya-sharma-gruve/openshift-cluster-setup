apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-blog-html
  namespace: demo-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>AI Blog</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          margin: 40px;
          background-color: #f4f8fb;
        }
        h1 {
          color: #0057b8;
        }
        li {
          margin: 15px 0;
        }
      </style>
    </head>

    <body>
      <h1>AI Blog</h1>

      <h2>Popular AI Models and Use Cases</h2>

      <ul>
        <li>
          <b>GPT-5</b><br>
          Use cases: Conversational AI, code generation, document analysis,
          customer support automation.
        </li>

        <li>
          <b>Claude</b><br>
          Use cases: Long document processing, enterprise assistants,
          research analysis.
        </li>

        <li>
          <b>Gemini</b><br>
          Use cases: Multimodal AI, image understanding, productivity tools,
          data analysis.
        </li>

        <li>
          <b>Llama</b><br>
          Use cases: Open-source AI applications, private AI deployments,
          custom model training.
        </li>

        <li>
          <b>Mistral</b><br>
          Use cases: Lightweight AI inference, enterprise applications,
          efficient language processing.
        </li>
      </ul>

    </body>
    </html>
  .htaccess: |
    RewriteEngine On

    RewriteRule ^ai/?$ /index.html [L]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-blog
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-blog
  template:
    metadata:
      labels:
        app: ai-blog
    spec:
      containers:
      - name: apache
        image: registry.access.redhat.com/ubi9/httpd-24
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: html
          mountPath: /var/www/html
      volumes:
      - name: html
        configMap:
          name: ai-blog-html

---
apiVersion: v1
kind: Service
metadata:
  name: ai-blog-service
  namespace: demo-app
spec:
  selector:
    app: ai-blog
  ports:
  - port: 8080
    targetPort: 8080
