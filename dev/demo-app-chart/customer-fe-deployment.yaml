kind: ConfigMap
apiVersion: v1
metadata:
  name: nginx-config-customer
  namespace: demo-app
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8080;
        location /employee {
          proxy_pass http://apache-service:8080/employee.html;
        }
        location /salary {
          proxy_pass http://apache-service:8080/salary.html;
        }
        location /positions {
          proxy_pass http://apache-service:8080/positions.html;
        }
        location /customer {
          proxy_pass http://apache-service:8080/customer.html;
        }
      }
    }

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: customer-frontend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-frontend
  template:
    metadata:
      labels:
        app: customer-frontend
    spec:
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config-customer
            defaultMode: 420
      containers:
        - name: customer-fe
          image: 'bitnami/nginx:latest'
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: Service
metadata:
  name: customer-fe
  namespace: demo-app
spec:
  selector:
    app: customer-frontend
  ports:
  - port: 80
    targetPort: 8080
