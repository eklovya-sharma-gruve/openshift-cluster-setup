apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-token-sync
  namespace: grafana-operator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]